<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/RafaelAlvarenga.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rafael Alvarenga — todos os meus links em um só lugar." />
    <title>Rafael Alvarenga | DevLinks</title>
    <script>
      // Aplica o tema salvo antes do React montar, evitando o "piscar" de tema errado.
      try {
        var t = localStorage.getItem('devlinks:theme')
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.classList.toggle('dark', t === 'dark')
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
